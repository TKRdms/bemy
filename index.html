<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jadi pacarku yuk</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:pink;
      overflow:hidden;
    }

    .container{
      text-align:center;
    }

    h1{
      font-size:45px;
      margin-bottom:40px;
      color:white;
    }

    .btn{
      padding:15px 35px;
      font-size:20px;
      border:none;
      border-radius:15px;
      cursor:pointer;
      transition:0.2s;
      margin:10px;
    }

    #yes{
      background:#ff1493;
      color:white;
    }

    #yes:hover{
      transform:scale(1.1);
    }

    #no{
      background:white;
      color:#ff1493;
      position:absolute;
    }

    .love{
      position:absolute;
      color:red;
      font-size:25px;
      animation:fall 4s linear infinite;
    }

    @keyframes fall{
      0%{
        transform:translateY(-100px);
        opacity:1;
      }
      100%{
        transform:translateY(100vh);
        opacity:0;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>can i be ur gf..?</h1>

    <button class="btn" id="yes">YES</button>
    <button class="btn" id="no">NO</button>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.floor(Math.random() * (window.innerWidth - 100));
      const y = Math.floor(Math.random() * (window.innerHeight - 50));

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    yesBtn.addEventListener("click", () => {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          flex-direction:column;
          background:pink;
          color:white;
          text-align:center;
        ">
          <h1 style="font-size:60px;">YAYYY</h1>
          <p style="font-size:30px; margin-top:20px;">
            I knew you would say yes:]]]
          </p>
        </div>
      `;

      createHearts();
    });

    function createHearts(){
      setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("love");
        heart.innerHTML = "❤️";

        heart.style.left = Math.random() * window.innerWidth + "px";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 4000);

      }, 200);
    }
  </script>

</body>
</html>
